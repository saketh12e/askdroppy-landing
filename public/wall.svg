<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 714" preserveAspectRatio="xMidYMid slice">
  <!-- "Droplet" wallpaper: liquid cobalt folds. Original artwork for Ask Droppy.
       The folds exist so the Liquid Glass surfaces have structure to bend. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5fb4ff"/><stop offset=".38" stop-color="#2160ff"/><stop offset=".72" stop-color="#0c2fc4"/><stop offset="1" stop-color="#05155f"/>
    </linearGradient>
    <linearGradient id="f1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9fd9ff"/><stop offset=".35" stop-color="#3f86ff"/><stop offset="1" stop-color="#0a2ab6"/></linearGradient>
    <linearGradient id="f2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7cc4ff"/><stop offset=".4" stop-color="#2459f2"/><stop offset="1" stop-color="#081f93"/></linearGradient>
    <linearGradient id="f3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5aa6ff"/><stop offset=".45" stop-color="#1a45dc"/><stop offset="1" stop-color="#061873"/></linearGradient>
    <linearGradient id="f4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3f86ff"/><stop offset=".5" stop-color="#1235c0"/><stop offset="1" stop-color="#040f4f"/></linearGradient>
    <radialGradient id="sun" cx=".72" cy=".1" r=".55"><stop offset="0" stop-color="#e8f6ff" stop-opacity=".95"/><stop offset=".4" stop-color="#9ad6ff" stop-opacity=".35"/><stop offset="1" stop-color="#9ad6ff" stop-opacity="0"/></radialGradient>
    <filter id="soft" x="-5%" y="-5%" width="110%" height="110%"><feGaussianBlur stdDeviation="2.2"/></filter>
    <filter id="shadow" x="-5%" y="-20%" width="110%" height="140%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>
  <rect width="1100" height="714" fill="url(#bg)"/>
  <rect width="1100" height="714" fill="url(#sun)"/>

  <g filter="url(#soft)">
    <path d="M-40 250C120 170 260 330 430 270S700 120 860 170 1080 300 1160 230V760H-40Z" fill="#071b86" opacity=".55" filter="url(#shadow)"/>
    <path d="M-40 236C120 156 260 316 430 256S700 106 860 156 1080 286 1160 216V760H-40Z" fill="url(#f1)"/>
    <path d="M-40 236C120 156 260 316 430 256S700 106 860 156 1080 286 1160 216" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="3"/>

    <path d="M-40 392C150 312 300 452 520 388S820 268 980 330 1110 420 1160 380V760H-40Z" fill="#05136a" opacity=".55" filter="url(#shadow)"/>
    <path d="M-40 376C150 296 300 436 520 372S820 252 980 314 1110 404 1160 364V760H-40Z" fill="url(#f2)"/>
    <path d="M-40 376C150 296 300 436 520 372S820 252 980 314 1110 404 1160 364" fill="none" stroke="#cfeaff" stroke-opacity=".45" stroke-width="2.5"/>

    <path d="M-40 520C160 448 340 572 560 514S880 420 1040 470 1130 520 1160 500V760H-40Z" fill="#030d4d" opacity=".55" filter="url(#shadow)"/>
    <path d="M-40 506C160 434 340 558 560 500S880 406 1040 456 1130 506 1160 486V760H-40Z" fill="url(#f3)"/>
    <path d="M-40 506C160 434 340 558 560 500S880 406 1040 456 1130 506 1160 486" fill="none" stroke="#bfe0ff" stroke-opacity=".38" stroke-width="2"/>

    <path d="M-40 628C200 576 380 668 600 624S900 560 1160 604V760H-40Z" fill="url(#f4)"/>
    <path d="M-40 628C200 576 380 668 600 624S900 560 1160 604" fill="none" stroke="#a9d3ff" stroke-opacity=".3" stroke-width="1.6"/>
  </g>
</svg>
